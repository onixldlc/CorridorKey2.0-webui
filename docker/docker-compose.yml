# Two ways to run the image.
#
#   docker compose -f docker/docker-compose.yml up ck-web-dev
#       The UI with the mock keyer. No GPU, no weights, no downloads.
#
#   CK_DATA=/srv/ck-web \
#   docker compose -f docker/docker-compose.yml --profile prod up -d ck-web
#       The real thing on a rented box. The keyer is already in the image;
#       CK_DATA only holds the clips and the ~5.1 GB of weights, so put it
#       somewhere with room.
services:
  ck-web-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ck-web:dev
    container_name: ck-web-dev
    environment:
      CKWEB_MODE: "dev"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ck_web_dev_data:/data

  ck-web:
    profiles: ["prod"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ck-web:latest
    container_name: ck-web
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CKWEB_MODE: "prod"
      CKWEB_PROVIDER: "auto"
      # "auto" generates a token at startup and prints it, with a ready-made
      # ?t= link, in the container log: docker compose logs ck-web | grep open
      # Export CKWEB_TOKEN to pin a fixed one instead.
      CKWEB_TOKEN: "${CKWEB_TOKEN:-auto}"
    ports:
      # Localhost only. Tunnel in: ssh -L 8080:localhost:8080 user@gpu-box
      - "127.0.0.1:8080:8080"
    volumes:
      # Clips and installed weights. The runtime is in the image.
      - "${CK_DATA:?set CK_DATA to a directory with room for the weights and your clips}:/data"
    restart: unless-stopped

volumes:
  ck_web_dev_data:
