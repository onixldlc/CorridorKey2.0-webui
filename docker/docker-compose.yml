# The UI with the mock keyer: no GPU, no weights, nothing downloaded.
#
#   docker compose -f docker/docker-compose.yml up --build
#   podman-compose -f docker/docker-compose.yml up --build
#
# The real thing lives in docker-compose.prod.yml, in its own file on purpose:
# it needs CK_DATA set, and podman-compose resolves every variable in the file
# it parses — including ones belonging to a service it was not asked to start,
# and including services behind a profile, which it does not implement. One
# required variable in here would therefore break this dev run with a
# RuntimeError before anything was built.
services:
  ck-web-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ck-web:dev
    container_name: ck-web-dev
    environment:
      CKWEB_MODE: "dev"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ck_web_dev_data:/data

volumes:
  ck_web_dev_data:
